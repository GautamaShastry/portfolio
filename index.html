<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%SITE.logo%" />
    <link rel="apple-touch-icon" href="%SITE.logo%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%SITE.themeColor%" />
    <title>%SITE.title%</title>
    <meta name="description" content="%SITE.description%" />
    <meta name="author" content="%SITE.legalName%" />
    <link rel="canonical" href="%SITE.siteUrl%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE.siteUrl%/" />
    <meta property="og:title" content="%SITE.title%" />
    <meta property="og:description" content="%SITE.description%" />
    <meta property="og:image" content="%SITE.siteUrl%%SITE.logo%" />
    <meta property="og:site_name" content="%SITE.title%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%SITE.title%" />
    <meta name="twitter:description" content="%SITE.description%" />
    <meta name="twitter:image" content="%SITE.siteUrl%%SITE.logo%" />

    <script type="application/ld+json">%SITE.jsonLd%</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
